{%extends 'base.html'%}
{% block content %}
                <!-- Центральная область: список писем -->
                <div class="col-12 col-md-9 col-xl-7 border-end border-start border-light" style="background: #ffffff;">
                    <div class="p-3 border-bottom bg-white d-flex justify-content-between align-items-center flex-wrap">
                        <h5 class="m-0 fw-semibold" id="folderTitle">Рассылки сообщений</h5>
                        <div class="d-flex gap-2 mt-2 mt-sm-0">
                            <button class="btn btn-sm btn-outline-secondary rounded-pill" ><i class="bi bi-calendar2-plus"></i> Создать</button>

                        </div>
                    </div>
                    <div class="scroll-list">
                        {% for send_mes in sending_messages %}
                            <p>{{ send_mes }}
                                <a role="button" class="btn btn-sm btn-outline-secondary rounded-pill" href=#><i class="bi bi-arrow-repeat"></i> Редактировать</a>
                                <a role="button" class="btn btn-sm btn-outline-secondary rounded-pill" href=#><i class="bi bi-trash"></i> Удалить</a>
                            </p>

                        {% endfor %}
                    </div>
                        </div>
                </div>
            </div>
        </div>
{% endblock %}
