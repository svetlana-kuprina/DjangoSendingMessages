{%extends 'base.html'%}
{% block content %}
                <!-- Центральная область -->
                <div class="col-12 col-md-9 col-xl-7 border-end border-start border-light" style="background: #ffffff;">
                    <div class="p-3 border-bottom bg-white d-flex justify-content-between align-items-center flex-wrap">
                        <h5 class="m-0 fw-semibold" id="folderTitle">Статистика</h5>

                    </div>
                    <div class="scroll-list">
                        <p>Пользователь: {{ owner }}</p>
                        <p>Всего попыток рассылок: {{ statistics|length }}</p>
                        <p>Количество  успешных попыток рассылок: {{ successful_count }}</p>
                        <p>Количество неуспешных попыток рассылок: {{ Unsuccessful_count }}</p>
                    </div>
                    </div>
                </div>
            </div>
        </div>
{% endblock %}
