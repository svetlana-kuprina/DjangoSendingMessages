<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Рассылки сообщений</title>
    <!-- Bootstrap 5 CSS + Icons + основной стиль -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons (для иконок) -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <!-- Google Fonts для аккуратного текста -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
    <style>
        * {
            font-family: 'Inter', sans-serif;
        }
        body {
            background: #f2f5f9;
            overflow-x: hidden;
        }
        /* кастомная обертка для имитации desktop-приложения */
        .mail-app {
            background: #ffffff;
            border-radius: 28px;
            box-shadow: 0 20px 35px -12px rgba(0, 0, 0, 0.08), 0 1px 2px rgba(0, 0, 0, 0.02);
            overflow: hidden;
            margin: 20px auto;
            transition: all 0.2s;
        }
        /* левая панель навигации (стиль inbox) */
        .sidebar-nav {
            background: #fefefe;
            border-right: 1px solid #e9edf2;
            height: 100%;
        }
        .compose-btn {
            background: #0b57d0;
            color: white;
            border-radius: 40px;
            padding: 10px 20px;
            font-weight: 500;
            font-size: 0.95rem;
            transition: all 0.2s;
            border: none;
            width: 100%;
        }
        .compose-btn:hover {
            background: #0842a0;
            color: white;
        }
        .nav-item-custom {
            padding: 10px 16px;
            margin: 2px 8px;
            border-radius: 28px;
            font-weight: 500;
            color: #1e2a3e;
            transition: all 0.2s;
            cursor: pointer;
        }
        .nav-item-custom i {
            margin-right: 14px;
            font-size: 1.3rem;
            vertical-align: middle;
        }
        .nav-item-custom.active {
            background: #e8f0fe;
            color: #0b57d0;
        }
        .nav-item-custom:hover:not(.active) {
            background: #f1f3f7;
        }
    </style>
</head>
<body class="bg-light">
{% include 'includes/inc_header.html' %}
{% block content %}
{% endblock %}

</body>
</html>
